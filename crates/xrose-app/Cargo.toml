[package]
name = "xrose-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
xrose-core = { path = "../xrose-core" }
gpui-kit.workspace = true
gpui-base.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio.workspace = true
image.workspace = true
quircs.workspace = true
smallvec = "1"
env_logger = "0.11"
parking_lot.workspace = true
raw-window-handle.workspace = true

[dev-dependencies]
qrcode.workspace = true

[build-dependencies]
cc.workspace = true
embed-resource = "3"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"
block.workspace = true

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
notify-rust.workspace = true

[target.'cfg(windows)'.dependencies]
xcap = { workspace = true, features = ["wgc"] }
winreg.workspace = true
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
freedesktop-icons.workspace = true
freedesktop-desktop-entry.workspace = true
resvg.workspace = true
ashpd.workspace = true
xcap.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v5"] }
wayland-client.workspace = true
wayland-protocols.workspace = true
ksni.workspace = true
x11rb.workspace = true

[lints.rust]
# `objc`'s `msg_send!`/`class!`/`sel!` macros expand to
# `cfg_attr(feature = "cargo-clippy", ...)`. The feature is not declared by
# this crate, so test it as an expected value instead of silencing all
# unexpected-cfg checking.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
