[workspace]
resolver = "2"
members = ["crates/xrose-core", "crates/xrose-app", "crates/xrose-cli"]
exclude = [".probe", ".probe2"]

[workspace.package]
version = "0.4.1"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.95"

[workspace.dependencies]
gpui-kit = "0.9.0"
gpui-base = "0.9.0"
freedesktop-icons = "0.4"
freedesktop-desktop-entry = { version = "0.8", default-features = false }
resvg = { version = "0.46", default-features = false }
netdev = "0.31"
system-configuration = "0.7"
dispatch2 = { version = "0.3", default-features = false, features = ["std"] }
gethostname = "1.1"
hickory-proto = "0.25"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
async-trait = "0.1"
async-socks5 = "0.6"
tokio-smoltcp = "0.7"
smoltcp = { version = "0.14", default-features = false, features = ["proto-ipv4", "proto-ipv4-fragmentation", "fragmentation-buffer-size-8192", "reassembly-buffer-size-8192", "reassembly-buffer-count-16"] }
tokio-util = { version = "0.7", features = ["rt"] }
socket2 = "0.6"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "sync", "time", "net", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks", "gzip", "brotli", "deflate"] }
futures-util = "0.3"
base64 = "0.23"
sha2 = "0.11"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.13"
directories = "6"
rusqlite = { version = "0.41", features = ["bundled"] }
psl = "2"
zip = { version = "9.2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
fs2 = "0.4"
chacha20poly1305 = "0.11"
snow = "0.10"
url = "2"
percent-encoding = "2"
regex = "1"
aho-corasick = "1"
semver = "1"
quircs = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }
x11rb = { version = "0.13", features = ["randr", "shape", "xfixes", "xinput"] }
xcap = "0.9.8"
cc = "1"
qrcode = { version = "0.14", default-features = false }
interprocess = "2"
bytes = "1"
tempfile = "3"
easytier = { git = "https://github.com/EasyTier/EasyTier", rev = "8428a89d2dabc94c97d370ec607c6ca142473626" }
ipnet = { version = "2", features = ["serde"] }
prost = "0.14"
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
widestring = "1.2"
raw-window-handle = "0.6"
ashpd = { version = "0.13", default-features = false, features = ["async-io", "screenshot"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
ksni = { version = "0.3.7", features = ["blocking"] }
notify-rust = "4.11"
block = "0.1.6"
winreg = "0.55"

# `block` 0.1.6 declares an uninhabited `static`, which newer rustc releases
# report as a future incompatibility. The vendored copy fixes the type only;
# drop this patch once a release of `block` contains the fix.
[patch.crates-io]
block = { path = "vendor/block" }
# Apply the Windows font-size adjustment once when resolving inherited text styles.
gpui-pre = { path = "vendor/gpui-pre" }
# The Windows backend selects Natural Symmetric for glyph rasterization.
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }

[profile.dev]
# 精简开发环境下的 PDB 调试信息：仅保留行号，大幅减小 PDB 体积并大幅加速链接
debug = 1

# Keep interactive layout and frame rendering fast in local debug builds.
[profile.dev.package.gpui-pre]
opt-level = 2

[profile.dev.package.taffy]
opt-level = 2

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
